  # and why its verify is the same probe 06-console ends on.
  - name: 08-docs
    title: The deployment, recorded
    expectedMinutes: 2
    narrate:
      start:  'Recording the live deployment in the repository.'
      done:   'ai/context/deployment.md records the live deployment, from probed facts.'
      failed: 'The deployment record did not land; everything built is still there, only the write-up is missing.'
    modules: []
    requires:
      phases: [06-console]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "docs(deployment): record live deployment state"
            prefix: BASE
            contract: tasks/08-docs.TaskContract.yaml
      post:
        # THE PRODUCT GOES LIVE WITH ITS PROMOTION GATE. 01-scaffold deferred
        # `prod.promotion.dependsOn: [stage]`; this, the last landing, puts it
        # back, and from here on a change reaches prod only after stage.
        # Restoring touches only intent.yaml's `environments` section, which
        # `orun plan --changed` maps to no component, so this landing
        # redeploys nothing.
