            # component and every composition resolve — plus the merge's own
            # plan, in under a second instead of a runner's ~25s, and a tree
            # that fails is never pushed. The PR's CI still runs (`plan`
            # alone on a bootstrap branch, .github/workflows/ci.yml); nothing
            # waits for it. The merge runs every lane on main a minute later,
            # for real, and that convergence is what `await` watches.
            checks: local
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: 'The fleet deployed; the convergence run on main came back green.'
          with:
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 3600
            # Read every 5s, not the action's 40: the build moves on the moment
            # the run is green instead of up to 40s after it.
            pollSeconds: 5

  - name: 05-edge
    title: The API edge
    expectedMinutes: 4
    narrate:
      start:  'Deploying the API edge in front of the twelve services.'
      done:   'The edge is live on stage and prod, answering /health, in {{ .meta.elapsed }}.'
      failed: 'The edge did not come up; the failing step says why.'
    modules: [api-edge, api-edge-tests, platform-limits-tests]
    requires:
      # A GATE MAY ONLY NAME A PHASE THAT PLACES FILES. This used to require
      # `04-workers-restore`, which placed none, so orun derived it as
      # `unknown` — deliberately, its work being a landing and a deployment,
      # neither of which the product repo can be asked about — and the
      # requirement could therefore NEVER be satisfied. This phase refused for
      # the whole of a real bootstrap:
      #
      #     ✕ phase "05-edge" requires 04-workers-restore (unknown)
      #
      # That phase is gone (the fleet deploys once, with its bindings), and
      # `04-workers` is both its predecessor and a phase that places files, so
      # the gate answers from the files on disk. Phase order in this document
      # is what sequences a run; `requires` only catches somebody running 05
      # against a tree where 04 never happened.
      phases: [04-workers]
    hooks:
      pre:
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "phase({{ .phase.name }}): api-edge"
            prefix: BASE
            contract: tasks/05-edge.TaskContract.yaml
      post:
        # A RE-RUN MUST HAVE SOMETHING TO LAND. A convergence can fail AFTER
        # its pull request merged, and the merge has already put every file
        # this phase places on main; orun derives phase state from the tree,
        # so a forced re-run lands an EMPTY diff while the product's CI plans
        # `--changed`. Nothing redeploys, and the build reads green. So the
        # phase rewrites ONE trailing marker line in each component.yaml its
        # contract names — `# orun: redeploy <phase> <stamp>` — and the
        # landing has a diff that re-plans exactly those components. The
        # marker is a deploy trigger, not state: nothing reads it back.
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/tasks/05-edge.TaskContract.yaml"]
        # Brand what this phase placed before it lands (see 02-foundation).
        - id: stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        - id: restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        - id: pnpm-lockfile
          run: ["pnpm", "install", "--lockfile-only"]
        # CLEAR THIS LANDING'S OWN PEN BRANCH FIRST. A build that stopped
        # between the pen's push and the merge leaves `orun/<task>-<phase>` on
        # the remote; the retry commits a SIBLING of that commit, so the push
        # is rejected non-fast-forward — identically, on every retry, for
        # ever. Observed on pullely/multi-tenant-saas (2026-10-25): the build
        # stopped after 04-workers' PR went green, and every retry after it
        # died on this push without reaching one step of the phase's work.
        # A branch already merged is left alone; only a diverged one is
        # deleted, and only under `orun/`. tooling/bootstrap/pen-reset.mjs.
        - id: pen-reset
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/pen-reset.mjs", "--branch", "orun/{{ .phase.hooks.task.outputs.key }}-{{ .phase.name }}"]
        - id: land
          uses: orun.pr/land@v1
          label: API edge
          narrate: '{{ if eq .hooks.land.outputs.landed "true" }}PR #{{ .hooks.land.outputs.number }} is merged into main.{{ else }}Nothing new to land; main already has it.{{ end }}'
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "phase({{ .phase.name }}): api-edge"
            # CHECKED HERE, NOT BY A RUNNER (`checks: local`, orun >= v2.88.0):
            # `orun validate`, then `orun plan` as the pull request and as the
            # merge to main plan it, on the commit, before it is pushed. That
            # is exactly what the PR's `plan` job checks — the intent, every
            # component and every composition resolve — plus the merge's own
            # plan, in under a second instead of a runner's ~25s, and a tree
            # that fails is never pushed. The PR's CI still runs (`plan`
            # alone on a bootstrap branch, .github/workflows/ci.yml); nothing
            # waits for it. The merge runs every lane on main a minute later,
            # for real, and that convergence is what `await` watches.
            checks: local
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: 'The edge deployed; the convergence run on main came back green.'
          with:
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 1800
            # Read every 5s, not the action's 40: the build moves on the moment
            # the run is green instead of up to 40s after it.
            pollSeconds: 5
        - id: verify
          uses: orun.http/probe@v1
          narrate: 'Both /health endpoints answered.'
          with:
            urls:
              - "https://{{ .inputs.reponame }}-api-edge-stage.{{ .inputs.subdomain }}.workers.dev/health"
              - "https://{{ .inputs.reponame }}-api-edge-prod.{{ .inputs.subdomain }}.workers.dev/health"

