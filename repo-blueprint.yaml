        # the three projects that existed then, and the lanes install with
        # --frozen-lockfile, so this phase's packages were refused before a
        # test ran: `ERR_PNPM_OUTDATED_LOCKFILE … not up to date with
        # packages/contracts/package.json`. The landing stages it.
