apiVersion: orun.dev/v1
kind: Workflow
metadata:
  name: baseline-flow
inputs:
  baselineDir: { type: string, required: true, description: "Lumen repo root (blueprint source)" }
  outDir: { type: string, required: true, description: "Directory to scaffold the new repo into" }
  repoName: { type: string, required: true, pattern: "^[a-z][a-z0-9-]*$" }
  productName: { type: string, required: true }
  productDomain: { type: string, required: true }
outputs:
  planJobs: "steps.verify.outputs.jobs"
steps:
  - name: foundation
    run: ["/tmp/orun-v3", "new", "--blueprint", "blueprints/01-foundation.yaml", "--out", "{{ inputs.outDir }}", "--set", "repoName={{ inputs.repoName }}", "--set", "productName={{ inputs.productName }}", "--set", "productDomain={{ inputs.productDomain }}"]
    cwd: "{{ inputs.baselineDir }}"
    timeout: 5m
  - name: infrastructure
    needs: [foundation]
    run: ["/tmp/orun-v3", "new", "--blueprint", "blueprints/02-infrastructure.yaml", "--out", "{{ inputs.outDir }}", "--set", "repoName={{ inputs.repoName }}", "--set", "productName={{ inputs.productName }}", "--set", "productDomain={{ inputs.productDomain }}"]
    cwd: "{{ inputs.baselineDir }}"
    timeout: 5m
  - name: workers
    needs: [infrastructure]
    run: ["/tmp/orun-v3", "new", "--blueprint", "blueprints/03-workers.yaml", "--out", "{{ inputs.outDir }}", "--set", "repoName={{ inputs.repoName }}", "--set", "productName={{ inputs.productName }}", "--set", "productDomain={{ inputs.productDomain }}"]
    cwd: "{{ inputs.baselineDir }}"
    timeout: 5m
  - name: edge
    needs: [workers]
    run: ["/tmp/orun-v3", "new", "--blueprint", "blueprints/04-edge.yaml", "--out", "{{ inputs.outDir }}", "--set", "repoName={{ inputs.repoName }}", "--set", "productName={{ inputs.productName }}", "--set", "productDomain={{ inputs.productDomain }}"]
    cwd: "{{ inputs.baselineDir }}"
    timeout: 5m
  - name: console
    needs: [edge]
    run: ["/tmp/orun-v3", "new", "--blueprint", "blueprints/05-console.yaml", "--out", "{{ inputs.outDir }}", "--set", "repoName={{ inputs.repoName }}", "--set", "productName={{ inputs.productName }}", "--set", "productDomain={{ inputs.productDomain }}"]
    cwd: "{{ inputs.baselineDir }}"
    timeout: 5m
  - name: domain
    needs: [console]
    run: ["/tmp/orun-v3", "new", "--blueprint", "blueprints/06-domain.yaml", "--out", "{{ inputs.outDir }}", "--set", "repoName={{ inputs.repoName }}", "--set", "productName={{ inputs.productName }}", "--set", "productDomain={{ inputs.productDomain }}"]
    cwd: "{{ inputs.baselineDir }}"
    timeout: 5m
  - name: workspace
    needs: [domain]
    run: ["/tmp/orun-v3", "new", "--blueprint", "blueprints/07-workspace.yaml", "--out", "{{ inputs.outDir }}", "--set", "repoName={{ inputs.repoName }}", "--set", "productName={{ inputs.productName }}", "--set", "productDomain={{ inputs.productDomain }}"]
    cwd: "{{ inputs.baselineDir }}"
    timeout: 10m
  - name: verify
    needs: [workspace]
    run: ["/bin/sh", "-c", "/tmp/orun-v3 validate --intent intent.yaml 1>&2 && /tmp/orun-v3 plan --intent intent.yaml --output plan.json 1>&2 && /usr/bin/python3 -c \"import json;print(len(json.load(open('plan.json'))['jobs']))\""]
    cwd: "{{ inputs.outDir }}"
    timeout: 5m
    outputs:
      jobs: "stdout.trim()"
