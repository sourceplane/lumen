apiVersion: orun.dev/v1
kind: Workflow
metadata:
  name: live-flow
# End-to-end instantiation: scaffold the baseline phase-by-phase (nested
# workflow), publish it as a real repo, open a PR, wait for CI, merge.
#
# Requires: gh authenticated, an SSH key for the push remote, and a git author
# identity in the operator's git config — HOME is on the run: env base, so
# ~/.gitconfig is read normally and no author is baked in here.
inputs:
  baselineDir:   { type: string, required: true, description: "Path to the Lumen baseline checkout." }
  outDir:        { type: string, required: true, description: "Directory to scaffold into." }
  repoName:      { type: string, required: true, pattern: "^[a-z][a-z0-9-]*$" }
  productName:   { type: string, required: true }
  productDomain: { type: string, required: true }
  gitOrg:        { type: string, default: "sourceplane", description: "GitHub org that will own the new repo." }
  visibility:    { type: string, default: "private", values: ["private", "public"] }
outputs:
  planJobs: "steps.scaffold.outputs.planJobs"
  pr: "steps.open-pr.outputs.url"
steps:
  - name: scaffold
    workflow: baseline-flow.yaml
    with:
      baselineDir: "{{ inputs.baselineDir }}"
      outDir: "{{ inputs.outDir }}"
      repoName: "{{ inputs.repoName }}"
      productName: "{{ inputs.productName }}"
      productDomain: "{{ inputs.productDomain }}"
    outputs: { planJobs: "output.planJobs" }
    timeout: 30m

  # A multi-command git/gh sequence: the shell is chosen explicitly and is
  # visible in review, because argv-only is the default.
  - name: publish
    needs: [scaffold]
    run:
      - /bin/sh
      - -c
      - |
        set -e
        git init -q -b main
        git add -A
        git commit -qm "chore: scaffold {{ inputs.repoName }} from the Lumen baseline"
        gh repo create {{ inputs.gitOrg }}/{{ inputs.repoName }} --{{ inputs.visibility }} >/dev/null
        git remote add origin git@github.com:{{ inputs.gitOrg }}/{{ inputs.repoName }}.git
        git push -q -u origin main
        git checkout -qb probe
        date > PROBE
        git add PROBE
        git commit -qm "test: CI probe"
        git push -q -u origin probe
    cwd: "{{ inputs.outDir }}"
    envInherit: [SSH_AUTH_SOCK, GH_TOKEN, GITHUB_TOKEN]
    timeout: 5m

  - name: open-pr
    needs: [publish]
    run: ["gh", "pr", "create", "--repo", "{{ inputs.gitOrg }}/{{ inputs.repoName }}",
          "--head", "probe", "--title", "test: CI probe via live-flow",
          "--body", "Opened by the orun live-flow workflow."]
    cwd: "{{ inputs.outDir }}"
    envInherit: [GH_TOKEN, GITHUB_TOKEN]
    outputs: { url: "stdout.trim()" }

  # `gh pr checks` exits non-zero while checks are pending or failing, so the
  # poll condition is simply a zero exit — no output parsing needed.
  - name: wait-ci
    needs: [open-pr]
    run: ["gh", "pr", "checks", "{{ steps.open-pr.outputs.url }}", "--repo", "{{ inputs.gitOrg }}/{{ inputs.repoName }}"]
    envInherit: [GH_TOKEN, GITHUB_TOKEN]
    poll: { interval: 20s, timeout: 15m, until: "exitCode == 0" }

  - name: merge
    needs: [wait-ci]
    run: ["gh", "pr", "merge", "{{ steps.open-pr.outputs.url }}", "--repo", "{{ inputs.gitOrg }}/{{ inputs.repoName }}",
          "--squash", "--delete-branch"]
    envInherit: [GH_TOKEN, GITHUB_TOKEN]
