- name: webhooks-worker
  mode: copy
  source: baseline
  from: apps/webhooks-worker
  to: apps/webhooks-worker
  dependsOn:
  - membership-worker
  - policy-worker
- name: webhooks-worker-tests
  mode: copy
  source: baseline
  from: tests/webhooks-worker
  to: tests/webhooks-worker
  dependsOn:
  - webhooks-worker
phases:
- name: workers
  modules:
  - admin-worker
  - admin-worker-tests
  - billing-worker
  - billing-worker-tests
  - config-worker
  - config-worker-tests
  - events-worker
  - events-worker-tests
  - identity-worker
  - identity-worker-tests
  - integrations-worker
  - integrations-worker-tests
  - membership-worker
  - membership-worker-tests
  - metering-worker
  - metering-worker-tests
  - notifications-worker
  - notifications-worker-tests
  - policy-worker
  - policy-worker-tests
  - projects-worker
  - projects-worker-tests
  - webhooks-worker
