apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-hyperdrive
  description: Provisions Cloudflare Hyperdrive resources for stage and prod Supabase Postgres databases
  labels:
    domain: infra
    scope: runtime-database-gateway

spec:
  type: terraform
  lifecycle: production
  owner: platform
  domain: infra

  # Hyperdrive's origin is the Supabase Postgres connection that `supabase`
  # writes to AWS Secrets Manager; it must run after that secret exists.
  dependsOn:
    - component: supabase

  parameters:
    orgName: sourceplane
    stackName: cloudflare-hyperdrive
    terraformDir: terraform
    terraformVersion: "1.15.3"

  env:
    AWS_EC2_METADATA_DISABLED: "true"

  # All three values resolve from orun secrets (project rung, brokered from
  # the Cloudflare integration): the provider credential is minted fresh per
  # run from the hyperdrive-edit template (Workers Hyperdrive Write — the
  # workers-deploy token deliberately cannot touch Hyperdrive), and the
  # account id is a non-secret connection fact (account-id template).
  # Component-level because plan-only lanes refresh against the live API too.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://lumen/lumen/{{ .environment }}/CLOUDFLARE_HYPERDRIVE_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://lumen/lumen/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://lumen/lumen/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"

  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
# ci: trigger convergence — first-boot infra bring-up (hyperdrive stage/prod)
