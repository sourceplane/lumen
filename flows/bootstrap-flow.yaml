apiVersion: orun.dev/v1
kind: Workflow
metadata:
  name: bootstrap-flow
# Full first-boot of this product against its Orun Cloud workspace (the
# `workspace:` in intent.yaml), in ONE convergence run: verify CLI auth, repo
# allow-listing, and provider integrations (waiting while the operator clicks
# the two OAuth consents if needed); create the five provider secrets from
# those integrations (brokered — no value is ever typed or seen); un-park the
# ENTIRE deployable fleet in a single main push with the service-binding
# feedback edges stripped; ride the one main convergence run to green (the
# platform DAG orders supabase → db-migrate/hyperdrive → workers → edge →
# console, and job-output secrets publish/resolve inside the run) — resuming
# it through transient failures; then restore the feedback bindings with a
# second push and verify the live endpoints.
#
# Run it from the repo root:   orun workflow run flows/bootstrap-flow.yaml
# Operator prerequisites (once, documented in flows/README.md and BOOTSTRAP.md):
#   - orun auth login --device            (approve at app.orun.dev/cli/device;
#                                          a browser session in the workspace —
#                                          the Chrome extension works when the
#                                          operator is an agent)
#   - Cloudflare + Supabase connected in the workspace (console → Integrations;
#     preflight WAITS for these, so they can be clicked while the flow runs)
#   - This repo allow-listed for CI OIDC (console → Git Repos; `orun cloud
#     check` verifies — the CLI cannot grant it, the console can)
inputs:
  dryrun:
    type: string
    default: "false"
    description: >-
      "true" previews every step without changing anything: connections and
      secret health are read and reported, the unpark/strip diff is shown and
      reverted, no push happens, converge only reports the latest main run,
      and verify-live reports endpoint codes without failing. Run:
      orun workflow run flows/bootstrap-flow.yaml --set org=<slug> --set dryrun=true
  workspace:
    type: string
    default: "lumen"
    description: >-
      Workspace id (ws_…) or slug the secrets and runs resolve against. A
      fork MUST pass its own workspace (--set workspace=<ws-id>); the
      baseline default fails loudly at preflight for any operator without
      access to it.
steps:
  - name: preflight
    run:
      - /bin/sh
      - -c
      - |
        set -e
        cd "$(git rev-parse --show-toplevel)"
        echo "── auth"
        orun auth status | grep -q "User:" || {
          echo "not logged in: run \`orun auth login --device\` and approve at https://app.orun.dev/cli/device (browser session in the workspace; the Chrome extension can approve it for agent operators)" >&2
          exit 1
        }
        echo "── integrations (ACTIVE github+cloudflare+supabase; polling up to 10m so consents can be clicked now)"
        # One authoritative probe FIRST: if the command itself fails (stale
        # CLI missing flags, revoked session, bad workspace id), fail loudly
        # with its stderr — never misread a broken command as "not connected
        # yet" and poll forever.
        if ! probe="$(orun integrations list --org "{{ inputs.workspace }}" --json 2>&1)"; then
          echo "orun integrations list failed — fix this before anything can poll:" >&2
          echo "$probe" >&2
          echo "(common causes: an old orun earlier in PATH — check \`which -a orun\`, need >= v2.49.2; or the CLI session expired — \`orun auth login\`)" >&2
          exit 1
        fi
        active() {
          orun integrations list --org "{{ inputs.workspace }}" --json 2>/dev/null |
            python3 -c "
        import json,sys
        try:
            rows=json.load(sys.stdin)
        except Exception:
            sys.exit(1)
        sys.exit(0 if any(r.get('provider')=='$1' and r.get('status')=='active' for r in rows) else 1)"
        }
        deadline=$(( $(date +%s) + 600 ))
        while :; do
          missing=""
          active github     || missing="github"
          active cloudflare || missing="${missing:+$missing }cloudflare"
          active supabase   || missing="${missing:+$missing }supabase"
          [ -z "$missing" ] && break
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "still missing ACTIVE connection(s) after 10m: $missing — connect them in the console (Integrations). Cloudflare: paste an Account API token per the in-console recipe; Supabase: OAuth, pick the organization that should own this product's projects; GitHub: install the app on this repo's org." >&2
            exit 1
          fi
          echo "waiting for connection(s): $missing → console → Integrations ({{ inputs.workspace }})"
          sleep 20
        done
        echo "── repo allow-list (self-heals via cloud link)"
        if ! orun cloud check --org "{{ inputs.workspace }}"; then
          echo "not allow-listed yet — running \`orun cloud link\` (uses the git remote + the workspace's GitHub integration)"
          orun cloud link --org "{{ inputs.workspace }}" || true
          orun cloud check --org "{{ inputs.workspace }}" || {
            echo "repo still not allow-listed for {{ inputs.workspace }}: grant it in the console (Git Repos)" >&2
            exit 1
          }
        fi
        echo "preflight ok"
    timeout: 12m

  # Brokered provider secrets (idempotent: self-heals orphans against the
  # CURRENT active connections — the create is skipped for healthy keys).
  - name: create-secrets
    needs: [preflight]
    # Steps execute in .orun/wfruns/<exec>/ — resolve the repo root first.
    run: ["/bin/sh", "-c", "cd \"$(git rev-parse --show-toplevel)\" && flows/common/create-secrets.sh {{ inputs.workspace }} \"{{ inputs.dryrun }}\""]
    timeout: 5m

  # ── Single-run deploy ────────────────────────────────────────────────────
  # One main push un-parks the whole fleet (cloudflare-domain stays parked —
  # its zone must exist first) with the service-binding feedback edges
  # stripped (tooling/bootstrap/cycle-break.mjs), so first-boot workers can
  # deploy in DAG order without referencing not-yet-existing services. The
  # merge's convergence run IS the deploy: terraform applies lease-publish
  # their outputs (SUPABASE_*, WIRING_*) and downstream lanes resolve them at
  # claim time, inside the same run.
  - name: deploy-all
    needs: [create-secrets]
    run:
      - /bin/sh
      - -c
      - |
        set -e
        cd "$(git rev-parse --show-toplevel)"
        git checkout main -q && git pull -q
        out="$(node flows/common/park.mjs unpark --all)"
        echo "$out"
        if printf '%s' "$out" | grep -q "nothing stashed"; then
          echo "deploy-all: fleet already live — leaving bindings untouched"
          exit 0
        fi
        node tooling/bootstrap/cycle-break.mjs --strip
        if [ "{{ inputs.dryrun }}" = "true" ]; then
          echo "DRY RUN: this change would be pushed to main (then reverted locally):"
          git status --short
          git diff --stat | tail -3
          git checkout -q -- .
          echo "DRY RUN: working tree reverted — nothing pushed"
          exit 0
        fi
        flows/common/push-main.sh deploy-all \
          "bootstrap: enable full fleet (single-run deploy, feedback edges stripped)" \
          "Un-parks every deployable component except cloudflare-domain and strips the service-binding feedback edges; this push's main convergence run deploys the entire platform in dependency order."
    timeout: 5m

  - name: converge
    needs: [deploy-all]
    run:
      - /bin/sh
      - -c
      - |
        set -e
        cd "$(git rev-parse --show-toplevel)"
        if [ "{{ inputs.dryrun }}" = "true" ]; then
          echo "DRY RUN: would wait for the main convergence run (resume budget 3); latest main run:"
          gh run list --branch main --limit 1 --json databaseId,status,conclusion \
            --jq '.[0]|"  run \(.databaseId): \(.status) \(.conclusion // "-")"'
          exit 0
        fi
        flows/common/converge.sh '' 3
    timeout: 120m

  # Second (final) push: put the stripped service bindings back — every worker
  # they point at now exists — and require that convergence green too.
  - name: restore-bindings
    needs: [converge]
    run:
      - /bin/sh
      - -c
      - |
        set -e
        cd "$(git rev-parse --show-toplevel)"
        if [ "{{ inputs.dryrun }}" = "true" ]; then
          echo "DRY RUN: stripped-edge state (would restore and push if any):"
          node tooling/bootstrap/cycle-break.mjs --check
          exit 0
        fi
        git checkout main -q && git pull -q
        node tooling/bootstrap/cycle-break.mjs --restore
        if git diff --quiet; then
          echo "restore-bindings: nothing stripped — already restored"
          exit 0
        fi
        flows/common/push-main.sh restore-bindings \
          "bootstrap: restore service-binding feedback edges (final wiring)"
        flows/common/converge.sh '' 2
    timeout: 60m

  - name: verify-live
    needs: [restore-bindings]
    run:
      - /bin/sh
      - -c
      - |
        set -e
        ok=0; fail=0
        for url in \
          https://lumen-api-edge-stage.rahulvarghesepullely.workers.dev/health \
          https://lumen-api-edge-prod.rahulvarghesepullely.workers.dev/health \
          https://lumen-web-console-next-stage.rahulvarghesepullely.workers.dev \
          https://lumen-web-console-next-prod.rahulvarghesepullely.workers.dev; do
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)"
          if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
            echo "✓ $url → $code"; ok=$((ok+1))
          else
            echo "✕ $url → $code" >&2; fail=$((fail+1))
          fi
        done
        if [ "{{ inputs.dryrun }}" = "true" ]; then
          echo "DRY RUN: $ok healthy, $fail unhealthy (not failing the step)"
          exit 0
        fi
        [ "$fail" -eq 0 ] || { echo "$fail endpoint(s) unhealthy" >&2; exit 1; }
        echo "bootstrap complete: $ok live endpoints"
    timeout: 5m
