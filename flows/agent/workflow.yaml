apiVersion: orun.dev/v1
kind: Workflow
metadata:
  name: agent-build
# The sandbox agent's entry point (saas-baseline-tracking, agent brief v2):
# three intake values in, four kinds of line out. Everything the environment
# already knows — workspace, repository, checkout, credentials — is read from
# it by flows/agent/build.sh, never retyped by the agent. Runs the umbrella
# (flows/phases/00-all) with tracking on and the CI watch mode decided by
# the build itself.
#
#   orun workflow run github:sourceplane/lumen@<tag>//flows/agent/workflow.yaml \
#     --set productname="Acme Cloud" --set productdomain=acme.dev --set subdomain=acme
inputs:
  productname:
    type: string
    description: Human product display name.
  productdomain:
    type: string
    description: Product domain (e.g. acme.dev).
  subdomain:
    type: string
    description: workers.dev subdomain.
  watch:
    type: string
    default: "auto"
    description: '"auto" (default) uses the product''s own CI when its workflow files landed and stops with the operator action when they did not; "true"/"false" force it.'
  domain:
    type: string
    default: "false"
    description: '"true" also attaches the custom domain (needs the Cloudflare zone to exist).'
steps:
  - name: build
    envInherit: [GITHUB_TOKEN, GH_TOKEN, ORUN_TOKEN, ORUN_TOKEN_FILE, GH_REPO, GH_HOST, ORUN_BACKEND_URL, ORUN_WORKSPACE, ORUN_ORG, ORUN_REPO_FULL_NAME, ORUN_REPO_DIR, XDG_CACHE_HOME, HOME, PATH]
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # ── context: baseline (local checkout, or self-pinned fetch) ──
        if BL="$(git rev-parse --show-toplevel 2>/dev/null)" && [ -f "$BL/repo-blueprint.yaml" ] && [ -d "$BL/flows/phases" ]; then
          L="$BL"
        else
          case "$PWD" in */.orun/wfruns/*) W="${PWD%%/.orun/wfruns/*}" ;; *) W="$PWD" ;; esac
          L="$W/baseline"
          brepo="${ORUN_FLOW_SOURCE_REPO:-sourceplane/lumen}"
          bref="${ORUN_FLOW_SOURCE_SHA:-main}"
          if [ "$(git -C "$L" rev-parse HEAD 2>/dev/null)" != "$bref" ]; then
            git init -q "$L" 2>/dev/null || true
            git -C "$L" remote add origin "https://github.com/$brepo" 2>/dev/null \
              || git -C "$L" remote set-url origin "https://github.com/$brepo"
            git -C "$L" -c credential.helper= -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth 1 origin "$bref" \
              || { echo "FAILED: could not fetch the baseline $brepo@$bref"; exit 1; }
            git -C "$L" checkout -q --detach FETCH_HEAD \
              || { echo "FAILED: could not check the baseline out"; exit 1; }
          fi
        fi
        export BASELINE_DIR="$L" BASELINE_REF="$(git -C "$L" rev-parse HEAD 2>/dev/null || true)"
        exec "$L/flows/agent/build.sh" \
          --product-name "{{ inputs.productname }}" --product-domain "{{ inputs.productdomain }}" \
          --subdomain "{{ inputs.subdomain }}" --watch "{{ inputs.watch }}" --domain "{{ inputs.domain }}"
    timeout: 4h
