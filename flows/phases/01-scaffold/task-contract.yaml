# Task contract template for the 01-scaffold landing (saas-baseline-tracking BT1).
# Unbound to a key on purpose: `orun task create --contract` seals and
# attaches it to the key the allocator issues. gates: [] is a DECLARATION —
# merge alone finishes this task; the main convergence is the gate the flow
# watches, not one the plane observes as a PR check.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The product repo is born — intent, CI, tooling and identity — and linked to its workspace
  affects:
    - intent.yaml
    - .github/workflows
    - tooling
    - .rebrand
  doneWhen:
    - repo pushed and main pinned as default
    - workspace linked (orun cloud link)
  gates: []
