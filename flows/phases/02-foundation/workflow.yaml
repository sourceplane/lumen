apiVersion: orun.dev/v1
kind: Workflow
metadata:
  name: phase-02-foundation
# Phase 2: the package foundation (flows/phases/02-foundation/blueprint.yaml — the 13
# shared packages and their test components). Verify-only lanes; nothing
# deploys yet, so no provider connections are needed.
# Run FROM THE BASELINE checkout:
#   orun workflow run flows/phases/02-foundation/workflow.yaml \
#     --set out=<product-repo-path> --set workspace=<ws-id>
inputs:
  out:
    type: string
    description: Absolute path of the product repo (created by phase 01-scaffold).
  workspace:
    type: string
    description: Workspace id (ws_…) or slug this product deploys against.
  dryrun:
    type: string
    default: "false"
    description: '"true" previews the phase (blueprint applied + shown + reverted, no PR, no deploy).'
steps:
  - name: apply
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        L="$(git rev-parse --show-toplevel)"
        "$L/flows/common/apply-blueprint.sh" "$L" flows/phases/02-foundation/blueprint.yaml "{{ inputs.out }}" "{{ inputs.workspace }}" "{{ inputs.dryrun }}"
    timeout: 10m
  - name: land
    needs: [apply]
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        L="$(git rev-parse --show-toplevel)"
        [ "{{ inputs.dryrun }}" = "true" ] && { echo "DRY RUN: skipping PR/merge"; exit 0; }
        "$L/flows/common/land-pr.sh" "{{ inputs.out }}" 02-foundation "phase(02-foundation): shared packages"
    timeout: 30m
  - name: converge
    needs: [land]
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        L="$(git rev-parse --show-toplevel)"
        [ "{{ inputs.dryrun }}" = "true" ] && { echo "DRY RUN: would watch the main convergence run (resume budget 3)"; exit 0; }
        cd "{{ inputs.out }}"
        "$L/flows/common/converge.sh" '' 3
    timeout: 45m
