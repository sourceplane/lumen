          fi
        fi
        out="{{ inputs.out }}"; [ -n "$out" ] || out="$W/product"
        ws="{{ inputs.workspace }}"
        export UMB_FROM="{{ inputs.from }}" UMB_FRESH="{{ inputs.fresh }}" UMB_DRYRUN="{{ inputs.dryrun }}"
        . "$L/flows/common/umbrella.sh"
        [ "{{ inputs.dryrun }}" = "true" ] && { echo "DRY RUN: umbrella stops after the scaffold preview"; exit 0; }
        run_phase 02-foundation 3 --set "watch={{ inputs.watch }}"
    timeout: 60m

