  - name: verify
    needs: [docs]
    envInherit: *env
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # ── context: baseline (local checkout, or self-pinned fetch) ──
        if BL="$(git rev-parse --show-toplevel 2>/dev/null)" && [ -f "$BL/repo-blueprint.yaml" ] && [ -d "$BL/flows/phases" ]; then
          L="$BL"; W="$PWD"
        else
          case "$PWD" in */.orun/wfruns/*) W="${PWD%%/.orun/wfruns/*}" ;; *) W="$PWD" ;; esac
          L="$W/baseline"
          brepo="${ORUN_FLOW_SOURCE_REPO:-sourceplane/lumen}"
          bref="{{ inputs.baselineref }}"
          [ -n "$bref" ] || bref="${ORUN_FLOW_SOURCE_SHA:-main}"
          if [ "$(git -C "$L" rev-parse HEAD 2>/dev/null)" != "$bref" ]; then
            echo "fetching baseline $brepo@$bref"
            git init -q "$L" 2>/dev/null || true
            git -C "$L" remote add origin "https://github.com/$brepo" 2>/dev/null \
              || git -C "$L" remote set-url origin "https://github.com/$brepo"
            git -C "$L" -c credential.helper= -c 'credential.helper=!f(){ [ "$1" = get ] && exec gh auth git-credential get; :; }; f' -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth 1 origin "$bref" \
              || { echo "baseline fetch FAILED for $brepo@$bref"; exit 1; }
            git -C "$L" checkout -q --detach FETCH_HEAD \
              || { echo "baseline checkout FAILED"; exit 1; }
          fi
        fi
        out="{{ inputs.out }}"; [ -n "$out" ] || out="$W/product"
        ws="{{ inputs.workspace }}"
        [ "{{ inputs.dryrun }}" = "true" ] && { echo "DRY RUN: umbrella stops after the scaffold preview"; exit 0; }
        # Independent end-to-end re-assertion — trusts no prior step's word:
        cd "$out"
        echo "── live URLs (edge /health + console, stage+prod)"
        "$L/flows/common/verify-endpoints.sh" "$out" edge console
        echo "── published job-output secrets (names only)"
        for env in stage prod; do
          missing=""
          for key in WIRING_CLOUDFLARE_KV WIRING_CLOUDFLARE_HYPERDRIVE SUPABASE_PROJECT_REF; do
            orun secrets list --org "$ws" --env "$env" 2>/dev/null | grep -q "$key" || missing="$missing $key"
          done
          [ -z "$missing" ] || { echo "missing on $env:$missing" >&2; exit 1; }
          echo "✓ $env: wiring secrets present"
        done
        echo "── committed docs manifest"
        git fetch -q origin main && git checkout -q main && git pull -q --ff-only
        git cat-file -e "HEAD:ai/context/deployment.md" || { echo "deployment.md not on main" >&2; exit 1; }
        if git grep -q "TBD_08DOCS" HEAD -- ai/context README.md 2>/dev/null; then
          echo "placeholder tokens remain in the committed docs" >&2; exit 1
        fi
        if [ "{{ inputs.track }}" = "true" ]; then
          echo "── the programme (task plane)"
          export ws
          if roll="$("$L/flows/common/track.sh" rollup "{{ inputs.epicslug }}" 2>/dev/null)" && [ -n "$roll" ]; then
            echo "epic {{ inputs.epicslug }}: $roll"
            # Observation lag is real (the tasks-worker drains scm.* on a
            # cron), so a landing not yet folded to done is a warning with
            # the epic named, never a failed bootstrap.
            case "$roll" in
              *" done"*) done_n="${roll%%/*}"; total_n="$(printf '%s' "$roll" | sed -E 's#^[0-9]+/([0-9]+) done.*#\1#')"
                [ "$done_n" = "$total_n" ] || echo "note: $((total_n - done_n)) task(s) not yet folded to done — the observation drain may still be catching up; check the epic in the console" ;;
            esac
          else
            echo "epic {{ inputs.epicslug }}: untracked (tracking degraded earlier — see the programme step's note)"
          fi
          # The deployment record rides the epic — the docs the console and the
          # next agent read, beside the tasks. Committed files, idempotent by
          # content hash; a refusal is a note, never a failed bootstrap.
          if [ -f ai/context/deployment.md ]; then
            if orun spec push --epic "{{ inputs.epicslug }}" --workspace "{{ inputs.workspace }}" ai/context/deployment.md ai/context/operations.md >/dev/null 2>&1; then
              echo "epic {{ inputs.epicslug }}: deployment record attached (deployment.md, operations.md)"
            else
              echo "note: could not attach the deployment record to the epic — the docs are on main regardless"
            fi
          fi
        fi
        echo ""
        echo "✓✓ BOOTSTRAP COMPLETE — live, verified, documented."
        echo "   manifest: ai/context/deployment.md (URLs, identity, secrets inventory)"
        echo "   operate:  ai/context/operations.md"
        [ "{{ inputs.track }}" != "true" ] || echo "   tracked:  epic {{ inputs.epicslug }} in workspace $ws (one task per landing, PRs on orun/BASE-n-<phase>)"
    timeout: 15m
