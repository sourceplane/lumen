apiVersion: orun.dev/v1
kind: Workflow
metadata:
  name: bootstrap-all
# The UMBRELLA: nothing → live, documented baseline in ONE unattended run.
# Composes the phase workflows (01→06, optional 07, 08) with an EARLY
# credential write-probe (the expensive failure surfaces in the first minutes,
# not phase 03) and an independent final verification that re-asserts URLs,
# published secrets, and the committed docs manifest.
#
# RESUMABLE. A failed run is resumed by running it again: every phase whose
# postcondition already holds is skipped — established from a checkpoint when
# the workdir survives, and by PROBING REALITY (repo content on main, published
# wiring secrets, live endpoints) when it does not. Retries also stamp redeploy
# markers, because re-applying identical content plans EMPTY under
# `orun plan --changed` and would never deploy what a failed attempt left
# undeployed. flows/common/umbrella.sh carries the full rationale.
#
#   --set from=<phase>   replay from a named phase, ignoring the checkpoint
#   --set fresh=true     ignore every skip and run all phases again
#
# Each step below is: the inline baseline resolve (the one block that cannot be
# factored out — it is what LOCATES the shared helper), then one run_phase call.
#
# No agent needed. Headless container contract (BOOTSTRAP.md §2): export
# ORUN_TOKEN (ADMIN-role key) + GITHUB_TOKEN, then:
#   orun workflow run github:sourceplane/lumen@<tag>//flows/phases/00-all/workflow.yaml \
#     --set workspace=ws_… --set reponame=acme --set productname="Acme Cloud" \
#     --set productdomain=acme.dev --set subdomain=<workers-dev-subdomain>
# Local mode: same from this checkout, plus --set out=<product-path>.
#
# Operator prerequisites (the two things no token can self-heal):
#   1. workspace integrations connected (github+cloudflare+supabase) —
#      preflight polls 10 minutes so consents can be clicked while it waits;
#   2. the product repo allow-listed (console → Settings → Git repos) —
#      or pre-create nothing and let phase 01 create the repo, then
#      allow-list when preflight of phase 02 asks.
inputs:
  workspace:
    type: string
    description: Workspace id (ws_…) or slug this product deploys against.
  reponame:
    type: string
    description: Repo slug (lowercase; becomes <githuborg>/<reponame>).
  productname:
    type: string
    description: Human product display name.
  productdomain:
    type: string
    description: Product domain (e.g. acme.dev).
  subdomain:
    type: string
    description: >
      The Cloudflare ACCOUNT's workers.dev subdomain — NOT the product name.
      Every generated URL and the api-edge CORS allowlist are built from it, so
      a wrong value yields a product that deploys cleanly and is unreachable at
      every address it advertises. Find it in the Cloudflare dashboard under
      Workers & Pages → "*.<subdomain>.workers.dev".
  githuborg:
    type: string
    default: "sourceplane"
    description: GitHub org the repo lives under.
  out:
    type: string
    default: ""
    description: Product path (local mode). Empty = ./product (headless default).
  baselineref:
    type: string
    default: ""
    description: Baseline ref for the phases. Empty = the commit this flow was fetched from.
  domain:
    type: string
    default: "false"
    description: '"true" also runs phase 07 (needs the Cloudflare zone to exist) before the docs phase.'
  watch:
    type: string
    default: "auto"
    description: '"auto" watches the product''s own CI when its workflow files are on main and STOPS with the operator action (the App''s Workflows grant) when they are not; "true"/"false" force it — "false" skips convergence WATCHING (env cannot see Actions) and runs must then be verified out-of-band.'
  dryrun:
    type: string
    default: "false"
    description: '"true" previews the scaffold and stops (later phases need a real product tree).'
  from:
    type: string
    default: ""
    description: 'Resume point: skip every phase before this one (e.g. "05-edge"). Empty = let the checkpoint and the reality probes decide.'
  fresh:
    type: string
    default: "false"
    description: '"true" clears the checkpoint and runs every phase again, even ones whose postcondition already holds.'
  track:
    type: string
    default: "true"
    description: '"false" skips tracking this phase in the workspace task plane (saas-baseline-tracking BT): no milestone, no task, an untracked phase/… branch.'
  epicslug:
    type: string
    default: "infra-baselining"
    description: The epic the bootstrap tracks itself under (its slug); the umbrella creates it, a phase run alone adopts or creates it.
steps:
  # The programme first (saas-baseline-tracking BT3): the epic and its
  # phases exist in the workspace before the first commit, so the first
  # thing the console shows is the plan, then the landings. Idempotent by
  # identity (slug, name-within-epic) — a re-run adopts what it made — and
  # never blocking: an orun without the task-plane verbs, or a refused
  # write, says so once and the bootstrap proceeds untracked. Not subject
  # to the checkpoint: it is cheap, and a resumed run must see the same
  # epic.
  - name: programme
    envInherit: &env [GITHUB_TOKEN, GH_TOKEN, ORUN_TOKEN, ORUN_TOKEN_FILE, GH_REPO, GH_HOST, ORUN_BACKEND_URL, XDG_CACHE_HOME]
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        [ "{{ inputs.track }}" = "true" ] || { echo "track=false: the bootstrap is not tracked in the task plane"; exit 0; }
        [ "{{ inputs.dryrun }}" = "true" ] && { echo "DRY RUN: would ensure epic {{ inputs.epicslug }} and its phase milestones"; exit 0; }
        if BL="$(git rev-parse --show-toplevel 2>/dev/null)" && [ -f "$BL/repo-blueprint.yaml" ] && [ -d "$BL/flows/phases" ]; then
          L="$BL"
        else
          case "$PWD" in */.orun/wfruns/*) W="${PWD%%/.orun/wfruns/*}" ;; *) W="$PWD" ;; esac
          L="$W/baseline"
          brepo="${ORUN_FLOW_SOURCE_REPO:-sourceplane/lumen}"
          bref="{{ inputs.baselineref }}"
          [ -n "$bref" ] || bref="${ORUN_FLOW_SOURCE_SHA:-main}"
          if [ "$(git -C "$L" rev-parse HEAD 2>/dev/null)" != "$bref" ]; then
            echo "fetching baseline $brepo@$bref"
            git init -q "$L" 2>/dev/null || true
            git -C "$L" remote add origin "https://github.com/$brepo" 2>/dev/null \
              || git -C "$L" remote set-url origin "https://github.com/$brepo"
            git -C "$L" -c credential.helper= -c 'credential.helper=!f(){ [ "$1" = get ] && exec gh auth git-credential get; :; }; f' -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth 1 origin "$bref" \
              || { echo "baseline fetch FAILED for $brepo@$bref"; exit 1; }
            git -C "$L" checkout -q --detach FETCH_HEAD \
              || { echo "baseline checkout FAILED"; exit 1; }
          fi
        fi
        export ws="{{ inputs.workspace }}"
        ref="$(git -C "$L" rev-parse --short HEAD 2>/dev/null || echo unknown)"
        epic="$("$L/flows/common/track.sh" ensure-epic "{{ inputs.epicslug }}" "Infra baselining — {{ inputs.productname }}" \
          "Bootstrap of {{ inputs.githuborg }}/{{ inputs.reponame }} from sourceplane/lumen@$ref: one milestone per phase, one task per landing, PRs on orun/BASE-n-<phase>.")"
        [ -n "$epic" ] || exit 0  # track.sh said why; the bootstrap proceeds untracked
        for phase in 01-scaffold 02-foundation 03-infrastructure 04-workers 05-edge 06-console; do
          "$L/flows/common/track.sh" ensure-milestone "$epic" "$phase" >/dev/null || true
        done
        [ "{{ inputs.domain }}" != "true" ] || "$L/flows/common/track.sh" ensure-milestone "$epic" 07-domain >/dev/null || true
        "$L/flows/common/track.sh" ensure-milestone "$epic" 08-docs >/dev/null || true
        echo "programme: epic $epic laid out — $("$L/flows/common/track.sh" rollup "$epic")"
    timeout: 5m
  - name: scaffold
    needs: [programme]
    envInherit: *env
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # ── context: baseline (local checkout, or self-pinned fetch) ──
        if BL="$(git rev-parse --show-toplevel 2>/dev/null)" && [ -f "$BL/repo-blueprint.yaml" ] && [ -d "$BL/flows/phases" ]; then
          L="$BL"; W="$PWD"
        else
          case "$PWD" in */.orun/wfruns/*) W="${PWD%%/.orun/wfruns/*}" ;; *) W="$PWD" ;; esac
          L="$W/baseline"
          brepo="${ORUN_FLOW_SOURCE_REPO:-sourceplane/lumen}"
          bref="{{ inputs.baselineref }}"
          [ -n "$bref" ] || bref="${ORUN_FLOW_SOURCE_SHA:-main}"
          if [ "$(git -C "$L" rev-parse HEAD 2>/dev/null)" != "$bref" ]; then
            echo "fetching baseline $brepo@$bref"
            git init -q "$L" 2>/dev/null || true
            git -C "$L" remote add origin "https://github.com/$brepo" 2>/dev/null \
              || git -C "$L" remote set-url origin "https://github.com/$brepo"
            git -C "$L" -c credential.helper= -c 'credential.helper=!f(){ [ "$1" = get ] && exec gh auth git-credential get; :; }; f' -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth 1 origin "$bref" \
              || { echo "baseline fetch FAILED for $brepo@$bref"; exit 1; }
            git -C "$L" checkout -q --detach FETCH_HEAD \
              || { echo "baseline checkout FAILED"; exit 1; }
          fi
        fi
        out="{{ inputs.out }}"; [ -n "$out" ] || out="$W/product"
        ws="{{ inputs.workspace }}"
        export UMB_FROM="{{ inputs.from }}" UMB_FRESH="{{ inputs.fresh }}" UMB_DRYRUN="{{ inputs.dryrun }}"
        export UMB_TRACK="{{ inputs.track }}" UMB_EPICSLUG="{{ inputs.epicslug }}"
        export UMB_WATCH="{{ inputs.watch }}" UMB_REPO="{{ inputs.githuborg }}/{{ inputs.reponame }}"
        . "$L/flows/common/umbrella.sh"
        [ "{{ inputs.fresh }}" = "true" ] && bs_reset
        # Validate the subdomain BEFORE phase 01 bakes it into every file: a
        # product name passed here deploys cleanly and is dead at every URL it
        # advertises. One DNS lookup, no credentials. (dryrun still checks —
        # the point is to fail on a bad input, and a preview with a bad input
        # is exactly as wrong.)
        "$L/flows/common/check-subdomain.sh" "{{ inputs.subdomain }}"
        run_phase 01-scaffold 2 \
          --set "reponame={{ inputs.reponame }}" --set "productname={{ inputs.productname }}" \
          --set "productdomain={{ inputs.productdomain }}" --set "subdomain={{ inputs.subdomain }}" \
          --set "githuborg={{ inputs.githuborg }}"
    timeout: 25m

  - name: credprobe
    needs: [scaffold]
    envInherit: *env
    run:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # ── context: baseline (local checkout, or self-pinned fetch) ──
        if BL="$(git rev-parse --show-toplevel 2>/dev/null)" && [ -f "$BL/repo-blueprint.yaml" ] && [ -d "$BL/flows/phases" ]; then
          L="$BL"; W="$PWD"
        else
          case "$PWD" in */.orun/wfruns/*) W="${PWD%%/.orun/wfruns/*}" ;; *) W="$PWD" ;; esac
          L="$W/baseline"
          brepo="${ORUN_FLOW_SOURCE_REPO:-sourceplane/lumen}"
          bref="{{ inputs.baselineref }}"
          [ -n "$bref" ] || bref="${ORUN_FLOW_SOURCE_SHA:-main}"
          if [ "$(git -C "$L" rev-parse HEAD 2>/dev/null)" != "$bref" ]; then
            echo "fetching baseline $brepo@$bref"
            git init -q "$L" 2>/dev/null || true
            git -C "$L" remote add origin "https://github.com/$brepo" 2>/dev/null \
              || git -C "$L" remote set-url origin "https://github.com/$brepo"
            git -C "$L" -c credential.helper= -c 'credential.helper=!f(){ [ "$1" = get ] && exec gh auth git-credential get; :; }; f' -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth 1 origin "$bref" \
              || { echo "baseline fetch FAILED for $brepo@$bref"; exit 1; }
            git -C "$L" checkout -q --detach FETCH_HEAD \
              || { echo "baseline checkout FAILED"; exit 1; }
          fi
        fi
        out="{{ inputs.out }}"; [ -n "$out" ] || out="$W/product"
        ws="{{ inputs.workspace }}"
        [ "{{ inputs.dryrun }}" = "true" ] && { echo "DRY RUN: umbrella stops after the scaffold preview — later phases need a real product tree"; exit 0; }
        # The expensive lesson: a read-capable but write-denied key (role below
        # ADMIN) sails through everything until phase 03's secret writes, then
        # dies with a masked not_found — after ~30 minutes. Probe the WRITE
        # floor now, in minute two: create-secrets.sh is idempotent, so doing
        # the real thing early IS the probe, and phase 03's own secrets step
        # then finds everything "kept".
        cd "$out"
        "$L/flows/common/create-secrets.sh" "$ws"
    timeout: 15m

