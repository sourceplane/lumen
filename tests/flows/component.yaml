apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: flows-tests
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: starter-tests
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
# The bootstrap flows' contract tests (saas-baseline-tracking BT6). This
# component is the BASELINE's own: no phase blueprint lists tests/flows, so
# it never ships to a product — the flows it tests do not ship either.
