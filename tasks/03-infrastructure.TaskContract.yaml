# Task contract template for the 03-infrastructure landing (saas-baseline-tracking BT1).
# Unbound to a key on purpose: `orun task create --contract` seals and
# attaches it to the key the allocator issues. gates: [] is a DECLARATION —
# merge alone finishes this task; the main convergence is the gate the flow
# watches, not one the plane observes as a PR check.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The data plane's roots — Supabase and KV — are provisioned on stage and prod and their outputs published
  affects:
    - cloudflare-kv
    - supabase
  doneWhen:
    - WIRING_CLOUDFLARE_KV, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD and SUPABASE_DB_URL published on stage and prod
  gates: []
